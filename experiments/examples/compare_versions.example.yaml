version: 1

experiment:
  name: agenticsys_v1_vs_v2
  baseline: previous
  candidate: current
  # Run cold and stateful as separate experiments for the cleanest analysis.
  mode: cold
  # Shared k: every system answers the same question set this many times.
  # Latency, consistency, and post-run content evaluation use these same runs.
  repeats: 10
  timeout_s: 600
  seed: 20260731
  output_dir: ../results

# JSON and YAML suites are both accepted. The file may use either
# `test_cases:` (the existing AgenticSys shape) or `questions:`.
questions_file: ../../../AgenticSys_v2/tests/test_consistency/questions.evaluation.example.json

# Content judging is post-processing by default. This keeps expensive judge
# calls separate from the system timing/token measurements.
content_evaluation:
  enabled: true
  auto_run: false
  rubric_file: ./content_rubric.example.yaml
  audit_claim_extraction: true
  max_evidence_chars: 60000
  llm:
    # Same OpenAI chat-completions setup and retry posture as AgenticSys_v2,
    # but owned by AgenticEval so the evaluator stays decoupled.
    backend: openai
    model: gpt-4.1
    temperature: 0
    max_retries: 8
    timeout_s: 180

systems:
  previous:
    adapter: agenticsys_sse
    process:
      # Relative paths resolve from this YAML file, not the shell's CWD.
      cwd: ../../../AgenticSys_v1
      command: [python, server.py]
      startup_timeout_s: 240
      env:
        PORT: "49102"
        TRACE_VIEWER_DISABLE: "1"
        # Lets the checkout import the sibling Amem repository if it has not
        # been installed editable in the selected Python environment.
        PYTHONPATH: ".."
    config:
      base_url: http://127.0.0.1:49102
      case_id: "366132845011"
      trace_db: ../traces/previous.db

  current:
    adapter: agenticsys_sse
    process:
      cwd: ../../../AgenticSys_v2
      command: [python, server.py]
      startup_timeout_s: 240
      env:
        PORT: "49202"
        TRACE_VIEWER_DISABLE: "1"
        PYTHONPATH: ".."
    config:
      base_url: http://127.0.0.1:49202
      case_id: "366132845011"
      trace_db: ../traces/current.db
