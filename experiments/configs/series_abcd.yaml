version: 1

# Simple-question suite: every question has Python-computable ground truth, so
# correctness is settled by `oracles/case_facts.py` rather than by a judge.
#
# The system under test needs an interpreter with its own dependencies —
# the base 3.11.13 lacks matplotlib and fails the server at import time.
# Set AGENTIC_SYS_PYTHON to it; the fallback below only works if `python3`
# already has them.

experiment:
  name: agenticsys_series
  baseline: previous
  candidate: current
  # Stateful: one session per repeat, questions share history. Cold resets
  # before every turn, which makes any follow-up question unanswerable by
  # construction and measures nothing about memory.
  mode: stateful
  repeats: 3
  timeout_s: 600

  # A turn that timed out produced NO answer, so recording it as the system's
  # verdict measures the machine's traffic rather than the system's reasoning.
  # Retry re-asks it — but by replaying the whole pass, because recovery starts
  # with `/rewind`, which clears the case: a lone re-ask would drop a follow-up
  # into an empty session, where "the reacting period" has no referent and the
  # vague answer that follows is charged to the system.
  #
  # `error` and `out_of_scope` are deliberately NOT here. Those ARE the
  # system's behaviour, and re-rolling them until they look better would be
  # measuring persistence rather than quality.
  #
  # The wait matters as much as the retry: an immediate second attempt
  # re-enters the same congestion that caused the first timeout.
  retry:
    outcomes: [timeout, screen_timeout]
    attempts: 2
    backoff_s: 30
  seed: 20260802
  output_dir: ../results

  # The system writes a `qa_turn` memory per turn to a REAL store, and
  # `/rewind` purges only the case it clears — so whatever the last session of
  # each case wrote outlives the run. Snapshot before, restore after, and the
  # store ends holding exactly what it held: same ids, payloads and vectors.
  #
  # Repeat independence is handled separately, in the runner: one worker owns
  # a whole case, so rewind clears that case at every session start with no
  # concurrent writer racing it.
  memory_store:
    url: "${AMEM_STORE_URL:-http://127.0.0.1:6333}"
    collection: "${AMEM_COLLECTION_NAME:-amem_memories}"
    restore_after_run: true

  # RUN scopes pin the whole shape of a run — questions, k, cases, workers.
  # `--scope smoke` is one word instead of a line of flags remembered
  # correctly. Explicit flags still win over whatever a scope sets.
  scopes:
    # Exercises the whole pipeline — metrics, per-set tables, case and repeat
    # tabs — on a fraction of the judge spend. 32 records against the full
    # run's 216. Four questions across three sets, so the per-set sections
    # have something to separate; k=2 and two cases so both selectors have
    # something to switch between.
    #
    # This is a CHECK, not a measurement: k=2 over four questions is far too
    # little to compare two systems on. Read it to confirm the chain works,
    # then run the real thing.
    #
    # The selection is dependency-clean on purpose: b3's parent is b2 and both
    # are here, while a1 and c1 stand alone. Dropping b2 would leave b3 asking
    # about "the reacting period" with no turn that established one — the
    # selection would be measuring itself, not the system.
    smoke:
      questions:
        - a1_payment_returns_occurrence
        - b2_tsr_cdss_reaction
        - b3_bureau_during_reaction
        - c1_report_spending_summary
      repeats: 2
      # Quoted: the second folder's name really does end in a space, and the
      # system keys on the raw folder name.
      cases: ["366132845011", "11854808010 "]

  # QUESTION scopes select what is asked and NOTHING else — k, cases and
  # workers stay exactly as set above, so every rate rests on the repeats this
  # config intends. Use these when the numbers matter; use a run scope when the
  # point is to spend little. A question scope that tried to set `repeats` or
  # `cases` is refused rather than quietly honoured.
  question_scopes:
    # One series at a time, each a complete session with its chain intact.
    series_a: [q0_off_domain_rejection, a1_payment_returns_occurrence,
               a2_commercial_card_count, a3_commercial_card_balance,
               a4_external_delinquency_coverage, a5_latest_fico_score,
               a6_transactions_last_month]
    series_b: [b1_case_overview, b2_tsr_cdss_reaction,
               b3_bureau_during_reaction, b4_abnormal_transactions,
               b5_connected_transactions, b6_default_pattern,
               b7_intent_verdict, b9_model_opportunities_in_context]
    series_c: [c1_report_spending_summary]
    series_d: [d1_model_opportunities_cold]
    # The pair the D series exists for: B9 and D1 are the same question, asked
    # with and without the seven turns before it. They sit in different sets,
    # so they run as two separate sessions and the contrast survives. B9 needs
    # its whole chain, which is why the series-B turns are all here.
    cold_vs_warm:
      questions: [b1_case_overview, b2_tsr_cdss_reaction,
                  b3_bureau_during_reaction, b4_abnormal_transactions,
                  b5_connected_transactions, b6_default_pattern,
                  b7_intent_verdict, b9_model_opportunities_in_context,
                  d1_model_opportunities_cold]

# Owned by AgenticEval, not by the system under test. Both halves of the
# suite, asked in one session: simple questions a script can settle, then
# complex ones only a rubric can. `--question` selects a subset without
# needing a second config.
# A, B and C in ONE stateful session, in this order: series B's follow-ups
# ("the reacting period", "the conclusion") have no referent without the turns
# before them. `--question` selects a subset without needing another config.
questions_file:
  - ../questions/series_a.yaml
  - ../questions/series_b.yaml
  - ../questions/series_c.yaml
  - ../questions/series_d.yaml

content_evaluation:
  enabled: true
  # Oracles are free and deterministic; the judge cascade is not. Run it
  # explicitly with `evaluate-content` once runs.jsonl exists.
  auto_run: false
  # No `rubric_file`: questions.simple.yaml carries its own expectations
  # inline, so question and oracle cannot drift apart.
  # Three judge calls per answer, and no switches:
  #
  #   extract      the question and the answer      -> claims
  #   evidence     claims + ledger + the run trace  -> pointers, routes, must-haves
  #   eligibility  routes + briefs + earlier turns  -> one verdict per claim
  #
  # The ledger is ~13k tokens and travels exactly once. The split between the
  # last two is the one that matters: a judge that has already decided a claim
  # is sound describes a route that justifies it, so the description is written
  # before any verdict exists.
  max_evidence_chars: 60000
  # Oracle commands resolve from here, so `oracles/case_facts.py` works
  # regardless of the shell's cwd.
  oracle_cwd: ..
  oracle_timeout_s: 60
  llm:
    # openai here; `safechain` in the private environment, which routes the
    # same call through the gateway. Set LLM_BACKEND to override without
    # editing this file.
    backend: openai
    model: gpt-4.1
    temperature: 0
    # Applies to BOTH transports now. On safechain only timeouts are retried,
    # with backoff and a rebuilt model — a rejection or a schema error fails
    # the same way eight times over, so retrying it would only be slower.
    max_retries: 8
    # Generous because the gateway is slower than the API and the evidence
    # call carries a ~13k-token ledger. 180s timed out on `claim_eligibility`
    # mid-pass; the cost of a high ceiling is a slow failure, the cost of a low
    # one is a dead run.
    timeout_s: 600

systems:
  previous:
    adapter: agenticsys_sse
    process:
      # Relative paths resolve from this YAML file, not the shell's CWD.
      cwd: ../../../AgenticSys_20260608
      command: ["${AGENTIC_SYS_PYTHON:-python3}", server.py]
      startup_timeout_s: 240
      env:
        PORT: "49102"
        TRACE_VIEWER_DISABLE: "1"
        # Lets the checkout import the sibling Amem repository if it has not
        # been installed editable in the selected Python environment.
        PYTHONPATH: ".."
    config:
      base_url: http://127.0.0.1:49102
      case_id: "366132845011"
      trace_db: ../traces/previous.db

  current:
    adapter: agenticsys_sse
    process:
      cwd: ../../../AgenticSys_v2
      command: ["${AGENTIC_SYS_PYTHON:-python3}", server.py]
      startup_timeout_s: 240
      env:
        PORT: "49202"
        TRACE_VIEWER_DISABLE: "1"
        PYTHONPATH: ".."
    config:
      base_url: http://127.0.0.1:49202
      case_id: "366132845011"
      trace_db: ../traces/current.db
