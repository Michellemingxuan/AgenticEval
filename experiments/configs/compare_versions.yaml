version: 1

# Baseline = tag v0.1.3 (2026-06-11, "fix: modelbehaviour and chart silently
# dropped"), materialised as a standalone clone in ../../../AgenticSys_20260611 on
# branch baseline-v0.1.3. Candidate = the live AgenticSys_v2 working tree.
# HEAD is 112 commits / 234 files past the baseline.
#
# The system under test needs an interpreter with its own dependencies —
# the base 3.11.13 lacks matplotlib and fails the server at import time.
# Set AGENTIC_SYS_PYTHON to it; the fallback below only works if `python3`
# already has them.

experiment:
  name: agenticsys_v0.1.3_vs_head
  baseline: previous
  candidate: current
  # Stateful: one session per repeat, questions share history. Cold resets
  # before every turn, which makes any follow-up question unanswerable by
  # construction and measures nothing about memory.
  mode: stateful
  # Shared k for latency, consistency, and post-run content evaluation.
  repeats: 10
  timeout_s: 600
  seed: 20260731
  output_dir: ../results

questions_file: ../../../AgenticSys_v2/tests/test_consistency/questions.json

content_evaluation:
  enabled: true
  # Keep judge calls outside the timed AgenticSys experiment. Run the separate
  # evaluate-content command after runs.jsonl has been written.
  auto_run: false
  audit_claim_extraction: true
  max_evidence_chars: 60000
  # Add `rubric_file: ./<your-baseline-must-haves>.yaml` after the baselines
  # are supplied. Fact/number evaluation can run without must-haves.
  llm:
    # openai here; `safechain` in the private environment, which routes the
    # same call through the gateway. Set LLM_BACKEND to override without
    # editing this file.
    backend: openai
    model: gpt-4.1
    temperature: 0
    max_retries: 8
    timeout_s: 180

systems:
  previous:
    adapter: agenticsys_sse
    process:
      # Relative paths resolve from this YAML file, not the shell's CWD.
      cwd: ../../../AgenticSys_20260611
      command: ["${AGENTIC_SYS_PYTHON:-python3}", server.py]
      startup_timeout_s: 240
      env:
        PORT: "49102"
        TRACE_VIEWER_DISABLE: "1"
        # Lets the checkout import the sibling Amem repository if it has not
        # been installed editable in the selected Python environment.
        PYTHONPATH: ".."
    config:
      base_url: http://127.0.0.1:49102
      case_id: "366132845011"
      trace_db: ../traces/previous.db

  current:
    adapter: agenticsys_sse
    process:
      cwd: ../../../AgenticSys_v2
      command: ["${AGENTIC_SYS_PYTHON:-python3}", server.py]
      startup_timeout_s: 240
      env:
        PORT: "49202"
        TRACE_VIEWER_DISABLE: "1"
        PYTHONPATH: ".."
    config:
      base_url: http://127.0.0.1:49202
      case_id: "366132845011"
      trace_db: ../traces/current.db
