version: 1

# Simple questions: each has one right answer a Python script can compute, so
# the verdict never depends on a judge.
#
# Question, expectations, and oracle are ONE unit here. Split across files they
# are joined by name, and a rename on either side unwires the check silently:
# the question still runs, the oracle never fires, and the report shows a blank
# rather than a failure. That is how these rubrics sat dead until they were
# wired up. `content_evaluation.rubric_file` still exists for swapping a
# stricter rubric onto a fixed question set, and it now errors on an entry that
# matches no question.
#
# Owned by AgenticEval, not by the system under test: the baseline checkout
# carries its own copy of the question set, and if the copies drift the two
# systems answer different questions while the report still calls it a
# comparison.
#
# `expected_answers` commands run from `content_evaluation.oracle_cwd`.
# For `kind: boolean`, negation takes precedence when both pattern sets match:
# an affirmative pattern for an existence question fires inside the very
# sentence that denies it ("had NO returned payments").

questions:
  - name: payment_returns_occurrence
    question: "Did the customer have any payment returns?"
    evaluation:
      expected_answers:
        - id: has_payment_returns
          description: "Whether any payment was returned."
          kind: boolean
          command: [python3, oracles/case_facts.py, --case, '{case_id}', --fact, has_payment_returns]
          critical: true
          affirmative_patterns:
            - "\\b(had|has|have|were|was|are|is)\\b[^.]{0,60}\\breturn(ed|s)?\\b"
            - "\\b\\d[\\d,]*\\s+return(ed)?\\s+payments?\\b"
          negative_patterns:
            - "\\b(no|zero|none|not any)\\b[^.]{0,40}\\breturn"
            - "\\breturn(ed|s)?\\b[^.]{0,40}\\b(none|zero|0)\\b"
        - id: payment_return_count
          description: "Number of returned payments."
          command: [python3, oracles/case_facts.py, --case, '{case_id}', --fact, payment_return_count]
          tolerance: 0
          critical: true
          # The truth here is zero, and a correct answer says so in words
          # rather than writing the digit.
          accept_patterns:
            - "\\b(no|zero|none|not any)\\b[^.]{0,40}\\breturn"

  - name: commercial_card_count
    question: "How many commercial cards does the customer have?"
    evaluation:
      expected_answers:
        - id: commercial_card_count
          description: "Cards in the small-business (SBS) portfolio."
          command: [python3, oracles/case_facts.py, --case, '{case_id}', --fact, commercial_card_count]
          tolerance: 0
          critical: true

  # "these cards" refers to the previous question. Asked cold it has no
  # referent, so it is annotated as a follow-up and as memory-requiring: in
  # warm mode `memory_hit_rate` measures whether the prior turn was actually
  # carried, and in cold mode a vague answer here is the expected outcome
  # rather than a defect.
  - name: commercial_card_balance
    question: "What is the total balance of these cards?"
    memory_required: true
    relation:
      type: follow_up
      parent: commercial_card_count
    evaluation:
      expected_answers:
        - id: commercial_card_balance
          description: "Total balance across the commercial cards."
          command: [python3, oracles/case_facts.py, --case, '{case_id}', --fact, commercial_card_balance]
          # Answers commonly round to whole dollars.
          tolerance: 1
          critical: true

  - name: external_delinquency_coverage
    question: "Does the model have information about external delinquency behavior?"
    evaluation:
      expected_answers:
        - id: has_external_delinquency_features
          description: >-
            Whether the modelling table carries populated columns tagged with
            the external_delinquency concept.
          kind: boolean
          command:
            [python3, oracles/case_facts.py, --case, '{case_id}', --fact, has_external_delinquency_features]
          critical: true
          affirmative_patterns:
            - "\\b(yes|does|has|have|contains?|includes?|carries)\\b[^.]{0,80}\\bexternal\\b"
            - "\\bexternal (delinquenc|trade)"
          negative_patterns:
            - "\\b(no|not|lacks?|without|does not|no such)\\b[^.]{0,60}\\bexternal\\b"

  - name: latest_fico_score
    question: "What is the most recent FICO score?"
    evaluation:
      expected_answers:
        - id: latest_fico_score
          description: "FICO score for the most recent bureau month."
          command: [python3, oracles/case_facts.py, --case, '{case_id}', --fact, latest_fico_score]
          tolerance: 0
          critical: true

  - name: transactions_last_month
    question: "How many transactions happen in the last month?"
    evaluation:
      expected_answers:
        - id: transactions_last_month
          description: >-
            Spend transactions in the latest month present in the spends table.
          command:
            [python3, oracles/case_facts.py, --case, '{case_id}', --fact, transactions_last_month]
          tolerance: 0
          critical: true
