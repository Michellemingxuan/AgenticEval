[project]
name = "agentic-eval"
version = "1.0.0"
description = "Black-box, config-driven comparison framework for agentic Q&A systems"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40,<3.0",
  "PyYAML>=6.0,<7.0",
]

[project.scripts]
agentic-eval = "agentic_eval.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["agentic_eval*"]
